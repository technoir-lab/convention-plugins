name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [ checks_requested ]

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Run checks
        run: make check GRADLE_ARGS="--scan"

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6.5.0
        if: success() || failure()
        with:
          check_name: Test Report
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          detailed_summary: true
          fail_on_parse_error: true

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run functional tests
        run: make functional-test

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6.5.0
        if: success() || failure()
        with:
          check_name: Functional Test Report
          report_paths: '**/build/test-results/functionalTest/TEST-*.xml'
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          detailed_summary: true
          fail_on_parse_error: true

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1.77.0
        with:
          level: warning
          fail_level: error
